<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mentor AI | Învață cu direcție</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="text-white overflow-x-hidden">
  <noscript>Acest site necesită JavaScript pentru a funcționa.</noscript>
  <div id="root" class="min-h-screen">
    <div id="boot-fallback" class="boot-fallback">
      <div class="boot-fallback-mark">M</div>
      <p>Se încarcă Mentor AI…</p>
    </div>
  </div>
  <script>
    window.addEventListener('error', function (event) {
      var fallback = document.getElementById('boot-fallback');
      var root = document.getElementById('root');
      if (!fallback || !root || root.children.length > 1) return;
      fallback.innerHTML = '<p style="max-width:320px;text-align:center;padding:0 20px;">Nu am putut încărca aplicația (' + (event.message || 'eroare necunoscută') + '). Reîncarcă pagina.</p>';
    });
  </script>
  <script type="module" src="/main.jsx"></script>
</body>
</html>

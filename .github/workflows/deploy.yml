name: Deploy

# Sincronizează aplicația pe hosting la fiecare push pe main.
# Configurare completă (inclusiv pașii din DirectAdmin): vezi DEPLOY.md
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Un singur deploy în același timp; un push nou anulează unul în curs.
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifică sintaxa backend-ului
        # Un deploy cu o eroare de sintaxă lasă site-ul căzut, pentru că
        # Passenger nu poate porni procesul. Mai bine picăm aici.
        run: for file in $(find backend -name '*.js' -not -path '*/node_modules/*'); do node --check "$file" || exit 1; done

      - name: Verifică sintaxa JSX din frontend
        # `node --check` nu înțelege JSX, iar componentele sunt compilate în
        # browser: o eroare de sintaxă n-ar apărea nicăieri la deploy, doar ca
        # ecran alb la vizitator.
        run: |
          npm install --no-save --silent @babel/core@7 @babel/preset-react@7
          node -e "
            const babel = require('@babel/core');
            const fs = require('fs');
            const files = fs.readdirSync('frontend/components').map(f => 'frontend/components/' + f)
              .concat(['frontend/app.js', 'frontend/apiClient.js'])
              .filter(f => f.endsWith('.js'));
            let failed = 0;
            for (const file of files) {
              try {
                babel.transformSync(fs.readFileSync(file, 'utf8'),
                  { presets: ['@babel/preset-react'], filename: file, configFile: false, babelrc: false });
              } catch (error) {
                console.error('FAIL ' + file + ': ' + error.message.split('\n')[0]);
                failed++;
              }
            }
            if (failed) process.exit(1);
            console.log(files.length + ' fișiere JSX verificate, toate OK');
          "

      - name: Cere restart de la Passenger
        # Passenger repornește aplicația când se schimbă tmp/restart.txt.
        # Conținutul diferă la fiecare rulare, deci sincronizarea îl încarcă
        # mereu, iar codul nou intră în funcțiune imediat după deploy.
        run: |
          mkdir -p tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ" > tmp/restart.txt

      - name: Sincronizează prin FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          local-dir: ./
          # node_modules se instalează pe server (vezi DEPLOY.md), nu prin FTP:
          # sunt mii de fișiere și transferul ar dura enorm.
          #
          # ATENȚIE la `data/`: acțiunea șterge de pe server fișierele care nu
          # există local. Fără excluderea de mai jos, fiecare deploy ar șterge
          # baza de date a aplicației (conturi, monede, calendar).
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            data/**
            *.md
            cod cu Claude*
            mentor_ai_v3*.html

name: Deploy

# Pornește după ce workflow-ul CI a reușit pe main, sau manual.
# Configurare completă (inclusiv pașii din DirectAdmin): vezi DEPLOY.md
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Citește secretele/variabilele de pe environment-ul GitHub `mentor.ai`
    # (Settings → Environments). Repository secrets rămân vizibile ca fallback.
    environment: mentor.ai
    steps:
      - name: Verifică secretele FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          missing=0
          if [ -z "$FTP_SERVER" ]; then
            echo "::error::Lipsește FTP_SERVER. Settings → Environments → mentor.ai SAU Settings → Secrets and variables → Actions → Repository secrets. Numele trebuie să fie exact FTP_SERVER."
            missing=1
          fi
          if [ -z "$FTP_USERNAME" ]; then
            echo "::error::Lipsește FTP_USERNAME (același loc ca FTP_SERVER)."
            missing=1
          fi
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Lipsește FTP_PASSWORD (Repository sau Environment secret, nu Variable)."
            missing=1
          fi
          if [ -z "$FTP_SERVER_DIR" ]; then
            echo "::error::Lipsește variabila FTP_SERVER_DIR (ex: ./mentor-ai/). Settings → Environments → mentor.ai → Variables, sau Repository variables."
            missing=1
          fi
          exit "$missing"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalează dependințele
        run: npm ci

      - name: Verifică sintaxa backend-ului
        run: for file in $(find backend -name '*.js' -not -path '*/node_modules/*'); do node --check "$file" || exit 1; done

      - name: Compilează frontend-ul
        run: npm run build

      - name: Cere restart de la Passenger
        run: |
          mkdir -p tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ" > tmp/restart.txt

      - name: Include dist în upload
        # FTP-Deploy-Action respectă .gitignore, iar frontend/dist este ignorat
        # intenționat (se construiește aici). Scoatem regula doar pe runner.
        run: sed -i '/^dist\/$/d' .gitignore

      - name: Sincronizează prin FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            data/**
            *.md
            cod cu Claude*
            mentor_ai_v3*.html
            tests/**
            scripts/**
            reports/**
            coverage/**

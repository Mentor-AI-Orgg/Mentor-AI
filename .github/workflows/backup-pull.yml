name: Backup pull

# Descarcă cea mai nouă copie criptată și o păstrează 35 de zile ca artifact.
# GitHub Actions rulează în UTC: 01:30 UTC este 04:30 vara (EEST) și 03:30 iarna (EET).
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    environment: mentor.ai
    steps:
      - name: Descarcă cea mai nouă copie
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_SERVER}" ] || [ -z "${FTP_USERNAME}" ] || [ -z "${FTP_PASSWORD}" ] || [ -z "${FTP_SERVER_DIR}" ]; then
            echo "::error::Lipsesc FTP_SERVER, FTP_USERNAME, FTP_PASSWORD sau FTP_SERVER_DIR."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > "$HOME/.netrc"
          mkdir -p backup-download
          lftp -e "set ftp:ssl-force true; set ssl:verify-certificate no; set net:use-netrc true; open ftps://${FTP_SERVER}; cd ${FTP_SERVER_DIR}/backups; cls -1; bye" > /tmp/backup-list.txt
          newest="$(grep -E 'mentor-ai-[0-9]{4}-[0-9]{2}-[0-9]{2}\.json\.gz\.enc' /tmp/backup-list.txt | sed 's#.*/##' | sort | tail -n 1 || true)"
          if [ -z "${newest}" ]; then
            echo "::error::Nu am găsit nicio copie în backups/."
            exit 1
          fi
          lftp -e "set ftp:ssl-force true; set ssl:verify-certificate no; set net:use-netrc true; open ftps://${FTP_SERVER}; cd ${FTP_SERVER_DIR}/backups; get ${newest} -o backup-download/${newest}; bye"
          stamp="$(lftp -e "set ftp:ssl-force true; set ssl:verify-certificate no; set net:use-netrc true; open ftps://${FTP_SERVER}; cd ${FTP_SERVER_DIR}/backups; mdtm ${newest}; bye" | tr -cd '0-9' | head -c 14)"
          if [ "${#stamp}" -lt 14 ]; then
            echo "::error::Nu am putut citi data copiei."
            exit 1
          fi
          python3 -c 'import datetime,sys; stamp=sys.argv[1]; when=datetime.datetime.strptime(stamp,"%Y%m%d%H%M%S").replace(tzinfo=datetime.timezone.utc); age=datetime.datetime.now(datetime.timezone.utc)-when; sys.exit("Copia este mai veche de 26 de ore.") if age.total_seconds()>26*3600 else print("Copie", stamp, "vechime", age)' "$stamp"

      - uses: actions/upload-artifact@v4
        with:
          name: mentor-ai-backup
          path: backup-download/*.enc
          retention-days: 35

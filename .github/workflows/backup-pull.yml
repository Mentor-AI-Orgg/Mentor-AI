name: Backup pull

# Descarcă cea mai nouă copie criptată și o păstrează 35 de zile ca artifact.
# GitHub Actions rulează în UTC: 01:30 UTC este 04:30 vara (EEST) și 03:30 iarna (EET).
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    # Fără limita asta, un lftp blocat pe reconnect ține jobul 6 ore.
    timeout-minutes: 10
    environment: mentor.ai
    steps:
      - name: Descarcă cea mai nouă copie
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_SERVER}" ] || [ -z "${FTP_USERNAME}" ] || [ -z "${FTP_PASSWORD}" ] || [ -z "${FTP_SERVER_DIR}" ]; then
            echo "::error::Lipsesc FTP_SERVER, FTP_USERNAME, FTP_PASSWORD sau FTP_SERVER_DIR."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          umask 077
          # lftp 4.9 nu are `net:use-netrc`. Fără utilizator intră ca anonymous,
          # ignoră ~/.netrc, iar `set` pe variabila inexistentă lăsa procesul
          # deschis până la limita de 6 ore a jobului.
          printf 'machine %s\nlogin %s\npassword %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          # FTPS explicit pe 21, ca protocolul `ftps` din deploy. `ftps://` în
          # lftp e SSL implicit pe 990 și reîncerca la nesfârșit (net:max-retries 1000).
          # `open -u` ia parola din ~/.netrc; nu o punem în linia de comandă.
          cat > "$HOME/.lftprc" <<'EOF'
          set cmd:fail-exit yes
          set cmd:interactive no
          set cmd:move-background no
          set net:max-retries 1
          set net:timeout 30s
          set dns:fatal-timeout 15s
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ssl:check-hostname no
          set xfer:clobber yes
          EOF
          mkdir -p backup-download
          remote="${FTP_SERVER_DIR%/}/backups"
          lftp_open="open -u \"${FTP_USERNAME}\" ftp://${FTP_SERVER}"
          lftp -c "${lftp_open}; cd \"${remote}\"; cls -1" > /tmp/backup-list.txt
          newest="$(grep -E 'mentor-ai-[0-9]{4}-[0-9]{2}-[0-9]{2}\.json\.gz\.enc' /tmp/backup-list.txt | sed 's#.*/##' | sort | tail -n 1 || true)"
          if [ -z "${newest}" ]; then
            echo "::error::Nu am găsit nicio copie în backups/."
            exit 1
          fi
          lftp -c "${lftp_open}; cd \"${remote}\"; get ${newest} -o backup-download/${newest}"
          # lftp 4.9 nu are comanda `mdtm`. `quote MDTM` întoarce `213 YYYYMMDDHHMMSS`.
          stamp="$(lftp -c "${lftp_open}; cd \"${remote}\"; quote MDTM ${newest}" | grep -oE '20[0-9]{12}' | head -n 1 || true)"
          if [ "${#stamp}" -lt 14 ]; then
            echo "::error::Nu am putut citi data copiei."
            exit 1
          fi
          python3 -c 'import datetime,sys; stamp=sys.argv[1]; when=datetime.datetime.strptime(stamp,"%Y%m%d%H%M%S").replace(tzinfo=datetime.timezone.utc); age=datetime.datetime.now(datetime.timezone.utc)-when; sys.exit("Copia este mai veche de 26 de ore.") if age.total_seconds()>26*3600 else print("Copie", stamp, "vechime", age)' "$stamp"

      - uses: actions/upload-artifact@v4
        with:
          name: mentor-ai-backup
          path: backup-download/*.enc
          retention-days: 35
